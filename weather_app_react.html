<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Weather App</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .weather-display {
            text-align: center;
        }
        .weather-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
        .city-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .temperature {
            font-size: 60px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .description {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .detail-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .detail-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .quick-cities {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        .quick-cities h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: center;
        }
        .city-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .city-btn {
            padding: 8px 15px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .city-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // City coordinates database
        const CITIES = {
            'new york': { lat: 40.7128, lon: -74.0060, name: 'New York' },
            'london': { lat: 51.5074, lon: -0.1278, name: 'London' },
            'tokyo': { lat: 35.6762, lon: 139.6503, name: 'Tokyo' },
            'paris': { lat: 48.8566, lon: 2.3522, name: 'Paris' },
            'sydney': { lat: -33.8688, lon: 151.2093, name: 'Sydney' },
            'dubai': { lat: 25.2048, lon: 55.2708, name: 'Dubai' },
            'singapore': { lat: 1.3521, lon: 103.8198, name: 'Singapore' },
            'los angeles': { lat: 34.0522, lon: -118.2437, name: 'Los Angeles' }
        };

        // Weather code to icon/description
        function getWeatherInfo(code) {
            const weatherCodes = {
                0: { icon: '☀️', description: 'Clear Sky' },
                1: { icon: '🌤️', description: 'Mainly Clear' },
                2: { icon: '⛅', description: 'Partly Cloudy' },
                3: { icon: '☁️', description: 'Overcast' },
                45: { icon: '🌫️', description: 'Foggy' },
                48: { icon: '🌫️', description: 'Foggy' },
                51: { icon: '🌦️', description: 'Light Drizzle' },
                61: { icon: '🌧️', description: 'Light Rain' },
                63: { icon: '🌧️', description: 'Moderate Rain' },
                65: { icon: '🌧️', description: 'Heavy Rain' },
                71: { icon: '🌨️', description: 'Light Snow' },
                73: { icon: '🌨️', description: 'Moderate Snow' },
                75: { icon: '🌨️', description: 'Heavy Snow' },
                95: { icon: '⛈️', description: 'Thunderstorm' }
            };
            return weatherCodes[code] || { icon: '🌤️', description: 'Unknown' };
        }

        // Weather Display Component
        function WeatherDisplay({ weather }) {
            const weatherInfo = getWeatherInfo(weather.weathercode);
            
            return (
                <div className="weather-display">
                    <div className="weather-icon">{weatherInfo.icon}</div>
                    <div className="city-name">{weather.cityName}</div>
                    <div className="temperature">{Math.round(weather.temperature)}°F</div>
                    <div className="description">{weatherInfo.description}</div>
                    
                    <div className="details-grid">
                        <div className="detail-card">
                            <div className="detail-label">Feels Like</div>
                            <div className="detail-value">{Math.round(weather.feelsLike)}°F</div>
                        </div>
                        <div className="detail-card">
                            <div className="detail-label">Humidity</div>
                            <div className="detail-value">{weather.humidity}%</div>
                        </div>
                        <div className="detail-card">
                            <div className="detail-label">Wind Speed</div>
                            <div className="detail-value">{Math.round(weather.windSpeed)} mph</div>
                        </div>
                        <div className="detail-card">
                            <div className="detail-label">Pressure</div>
                            <div className="detail-value">{Math.round(weather.pressure)} mb</div>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Component
        function WeatherApp() {
            const [cityInput, setCityInput] = React.useState('');
            const [weather, setWeather] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [lastCity, setLastCity] = React.useState('');
            
            React.useEffect(() => {
                const saved = localStorage.getItem('lastCity');
                if (saved) {
                    setLastCity(saved);
                    fetchWeather(saved); // Auto-fetch last city
                }
            }, []);
            
            React.useEffect(() => {
                if (lastCity) {
                    localStorage.setItem('lastCity', lastCity);
                }
            }, [lastCity]);
            
            async function fetchWeather(cityName) {
                const cityKey = cityName.toLowerCase();
                const cityData = CITIES[cityKey];
                
                if (!cityData) {
                    setError('City not found. Try: New York, London, Tokyo, Paris, Sydney, Dubai, Singapore, or Los Angeles');
                    return;
                }
                
                setLoading(true);
                setError(null);
                
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${cityData.lat}&longitude=${cityData.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weathercode,windspeed_10m,surface_pressure&temperature_unit=fahrenheit&windspeed_unit=mph`;
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error('Failed to fetch weather');
                    }
                    
                    const data = await response.json();
                    
                    setWeather({
                        cityName: cityData.name,
                        temperature: data.current.temperature_2m,
                        feelsLike: data.current.apparent_temperature,
                        humidity: data.current.relative_humidity_2m,
                        windSpeed: data.current.windspeed_10m,
                        pressure: data.current.surface_pressure,
                        weathercode: data.current.weathercode
                    });
                    
                    setLastCity(cityKey);
                    
                } catch (err) {
                    setError('Failed to fetch weather data. Please try again.');
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            }

            function handleSearch() {
                if (cityInput.trim()) {
                    fetchWeather(cityInput);
                    setCityInput('');
                }
            }

            function handleKeyPress(e) {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            }

            function handleQuickCity(cityName) {
                fetchWeather(cityName);
            }
            
           return (
                <div className="container">
                    <h1>🌤️ React Weather App</h1>
                    
                    <div className="search-box">
                        <input 
                            type="text"
                            placeholder="Enter city name..."
                            value={cityInput}
                            onChange={(e) => setCityInput(e.target.value)}
                            onKeyPress={handleKeyPress}
                        />
                        <button 
                            onClick={handleSearch}
                            disabled={loading}
                        >
                            {loading ? 'Loading...' : 'Search'}
                        </button>
                    </div>
                    
                    {loading && (
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Fetching weather data...</p>
                        </div>
                    )}
                    
                    {error && (
                        <div className="error">
                            {error}
                        </div>
                    )}
                    
                    {!loading && !error && weather && (
                        <WeatherDisplay weather={weather} />
                    )}
                    
                    <div className="quick-cities">
                        <h3>Quick Cities:</h3>
                        <div className="city-buttons">
                            <button className="city-btn" onClick={() => handleQuickCity('new york')}>New York</button>
                            <button className="city-btn" onClick={() => handleQuickCity('london')}>London</button>
                            <button className="city-btn" onClick={() => handleQuickCity('tokyo')}>Tokyo</button>
                            <button className="city-btn" onClick={() => handleQuickCity('paris')}>Paris</button>
                            <button className="city-btn" onClick={() => handleQuickCity('sydney')}>Sydney</button>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeatherApp />);
    </script>
</body>
</html>
